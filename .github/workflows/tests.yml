name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * *' # nightly, 03:00 UTC
  workflow_dispatch:
    inputs:
      project:
        description: 'Which tests to run'
        type: choice
        options: [all, smoke]
        default: all

permissions:
  contents: write # publish the Allure report to the gh-pages branch

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5 # Allure CLI needs Java
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Start the Sock Shop microservices (Docker)
        run: npm run stack:up

      - name: Start a private Petstore for the Pact provider verification (Docker)
        run: docker compose -f infra/petstore/docker-compose.yml up -d --wait

      - name: Lint and type check
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Run tests
        id: tests
        continue-on-error: true
        env:
          PROJECT: ${{ github.event.inputs.project || 'all' }}
          # A missing Sock Shop stack must fail the run, not skip its tests.
          REQUIRE_STACK: '1'
          # Stored in Settings → Secrets and variables → Actions; GitHub masks it in logs.
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          case "$PROJECT" in
            smoke) npm run test:smoke ;;
            *)     npm test ;;
          esac

      - name: Restore Allure history
        if: always()
        run: |
          git fetch origin gh-pages --depth=1 || exit 0
          git worktree add gh-pages-old origin/gh-pages || exit 0
          if [ -d gh-pages-old/history ]; then
            mkdir -p allure-results/history
            cp -r gh-pages-old/history/. allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: npm run allure:generate

      - name: Keep the /fuzz and /contract reports and the guides on GitHub Pages
        if: always()
        run: |
          for d in fuzz contract; do if [ -d gh-pages-old/$d ]; then cp -r gh-pages-old/$d allure-report/$d; fi; done
          cp docs/schemathesis.html docs/toolbox.html docs/contract-drift.html docs/pact.html docs/graphql.html docs/test-environments.html allure-report/
          if ls pacts/*.json >/dev/null 2>&1; then mkdir -p allure-report/pact && cp pacts/*.json allure-report/pact/; fi

      - name: Publish Allure report to GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Sock Shop logs (only when something failed)
        if: steps.tests.outcome == 'failure'
        run: docker compose -f infra/sock-shop/docker-compose.yml logs --no-color --tail 150

      - name: Stop the Sock Shop and the Petstore
        if: always()
        run: |
          npm run stack:down
          docker compose -f infra/petstore/docker-compose.yml down -v

      - name: Fail the job if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
